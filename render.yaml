# One-click deploy on Render (render.com → New → Blueprint → pick this repository)
services:
  - type: web
    name: marsa
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: "node build.js"
    startCommand: "node server/server.js"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: MARSA_DB
        value: /tmp/marsa-v4.db
      - key: MARSA_DEMO
        value: "1"
      - key: MARSA_INTEGRATION_KEY
        generateValue: true
      - key: MARSA_VAPID_SEED
        generateValue: true
      - key: MARSA_VAPID_SUBJECT
        value: mailto:marsa-demo@example.invalid
